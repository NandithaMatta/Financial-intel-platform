version: 2

models:
  - name: stg_fintech__compensation
    description: "Staged fintech compensation data — cast, renamed, deduplicated."
    columns:
      - name: employee_id
        description: "Unique employee identifier"
        tests:
          - not_null
          - unique
      - name: base_salary
        description: "Annual base salary in USD"
        tests:
          - not_null
      - name: domain
        description: "Source domain"
        tests:
          - not_null
          - accepted_values:
              values: ['fintech']
      - name: employment_type
        description: "Type of employment contract"
        tests:
          - accepted_values:
              values: ['Full-Time', 'Part-Time', 'Contract']

  - name: stg_ecommerce__compensation
    description: "Staged e-commerce compensation data — cast, renamed, deduplicated."
    columns:
      - name: employee_id
        description: "Unique employee identifier"
        tests:
          - not_null
          - unique
      - name: base_salary
        description: "Annual base salary in USD"
        tests:
          - not_null
      - name: domain
        description: "Source domain"
        tests:
          - not_null
          - accepted_values:
              values: ['ecommerce']

  - name: stg_healthcare__compensation
    description: "Staged healthcare compensation data — cast, renamed, deduplicated."
    columns:
      - name: employee_id
        description: "Unique employee identifier"
        tests:
          - not_null
          - unique
      - name: base_salary
        description: "Annual base salary in USD"
        tests:
          - not_null
      - name: domain
        description: "Source domain"
        tests:
          - not_null
          - accepted_values:
              values: ['healthcare']

  - name: stg_fintech__headcount
    description: "Staged fintech headcount data — employee org structure"
    columns:
      - name: employee_id
        description: "Unique employee identifier"
        tests:
          - not_null
      - name: is_active
        description: "Whether employee is currently active"
        tests:
          - not_null

  - name: stg_fintech__payroll
    description: "Staged fintech payroll data — pay periods, gross/net pay"
    columns:
      - name: payroll_id
        description: "Unique payroll record identifier"
        tests:
          - not_null
          - unique
      - name: gross_pay
        description: "Gross pay for the pay period"
        tests:
          - not_null
      - name: payment_status
        description: "Status of payment processing"
        tests:
          - accepted_values:
              values: ['Processed', 'Pending', 'Failed']
